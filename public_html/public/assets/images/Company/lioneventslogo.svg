<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
    <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900" />
            <stop offset="50%" stop-color="#FF5500" />
            <stop offset="100%" stop-color="#CC3300" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Stylized Lion Crown / Shield Icon -->
    <g transform="translate(10, 8)">
        <polygon points="22,2 32,18 42,2 38,36 6,36 2,18 12,2 17,14 27,14" fill="url(#goldGrad)" filter="url(#glow)" />
        <circle cx="22" cy="24" r="5" fill="#FFFFFF" opacity="0.9" />
        <path d="M 12 40 L 32 40 L 22 45 Z" fill="url(#goldGrad)" />
    </g>
    <!-- Text: LION -->
    <text x="64" y="36" font-family="Montserrat, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="2">
        <tspan fill="url(#goldGrad)">LION</tspan> EVENTS
    </text>
    <!-- Subtitle: & ENTERTAINMENT -->
    <text x="66" y="50" font-family="Montserrat, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="600" font-size="9" fill="#FF9900" letter-spacing="4">
        &amp; ENTERTAINMENT
    </text>
</svg>